# Copy to infrastructure/kubernetes/secrets.yaml (gitignored) and fill real values.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: image-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: "changeme"
  MINIO_ACCESS_KEY: "accessKey1"
  MINIO_SECRET_KEY: "verySecretKey1"
  RABBITMQ_DEFAULT_PASS: "guest"
  # Composed connection strings (contain credentials → Secret, not ConfigMap).
  DATABASE_URL: "postgres://platform:changeme@postgres:5432/image_platform?sslmode=disable"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
  # Consumed by KEDA TriggerAuthentication (parameter: host). The KEDA operator runs
  # in the `keda` namespace, so it must use the cross-namespace FQDN — the bare
  # `rabbitmq` host only resolves inside image-platform (apps use RABBITMQ_URL above).
  RABBITMQ_AMQP_URL: "amqp://guest:guest@rabbitmq.image-platform.svc.cluster.local:5672/"
