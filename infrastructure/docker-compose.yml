services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-image_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-image_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage (Scality CloudServer).
  # Replaces minio/minio: in 2025 MinIO gated its registry images behind
  # `docker login` (docker.io and quay.io both reject anonymous pulls) and
  # removed the `:latest` tag, so the image was no longer freely pullable.
  # CloudServer speaks the same S3 API the minio-go client uses (bucket create /
  # put object / presigned GET), so the Go code and MINIO_* env names are
  # unchanged — only the endpoint (:8000), credentials, and healthcheck differ.
  # S3BACKEND=mem keeps objects in memory (fine for local dev / smoke tests).
  # Service name kept as `minio` so dependents' hostnames are unchanged.
  minio:
    image: zenko/cloudserver:latest-7.70.10
    restart: unless-stopped
    environment:
      S3BACKEND: mem
      REMOTE_MANAGEMENT_DISABLE: "1"
      # Register the `minio` hostname so CloudServer answers S3 requests whose
      # Host header is `minio:8000` (otherwise: "Could not parse the specified URI").
      ENDPOINT: minio
    ports:
      - "8000:8000"   # S3 API
    healthcheck:
      # CloudServer returns 403 to an unauthenticated GET /, which still proves
      # the server is up; node (the app runtime) is guaranteed present, unlike curl.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/',r=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI → http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Application services ────────────────────────────────────────────────────

  api-service:
    build:
      context: ../services/api-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      API_PORT: ${API_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-image_platform}?sslmode=disable
      MINIO_ENDPOINT: minio:8000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-accessKey1}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-verySecretKey1}
      MINIO_USE_SSL: "false"
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      MAX_MEGAPIXELS: ${MAX_MEGAPIXELS:-50000000}
      PRESIGNED_URL_TTL_MINUTES: ${PRESIGNED_URL_TTL_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  job-service:
    build:
      context: ../services/job-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      JOB_SERVICE_PORT: ${JOB_SERVICE_PORT:-8081}
      DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-image_platform}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-500}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # processing-worker:   # chapter 3
  #   build:
  #     context: ../services/processing-worker
  #     dockerfile: Dockerfile
  #   ...

  # frontend:   # chapter 4
  #   build:
  #     context: ../frontend
  #     dockerfile: Dockerfile
  #   ...

volumes:
  postgres_data:
  rabbitmq_data:
