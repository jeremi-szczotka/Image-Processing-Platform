server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 11m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/images {
        proxy_pass         http://api-service:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # /api/v1/jobs/{id}/result is served by api-service (presigned redirect),
    # not job-service — this specific location must precede the /api/v1/jobs prefix.
    location ~ ^/api/v1/jobs/[^/]+/result$ {
        proxy_pass         http://api-service:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /api/v1/jobs {
        proxy_pass         http://job-service:8081;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /healthz {
        proxy_pass http://api-service:8080;
    }
}
